services:
  - type: web
    name: ridemate
    runtime: node
    buildCommand: cd server && npm install && cd ../client && npm install && cd .. && npm run build
    startCommand: cd server && node index.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
    disk:
      mountPath: /data
      sizeGB: 1

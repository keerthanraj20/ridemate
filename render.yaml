services:
  - type: web
    name: ridemate
    runtime: node
    buildCommand: npm run setup && npm run build
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
    disk:
      mountPath: /data
      sizeGB: 1

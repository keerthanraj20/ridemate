services:
  - type: web
    name: ridemate
    runtime: node
    plan: free
    buildCommand: npm run setup && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: RM_TRUST_PROXY
        value: "1"
      - key: RM_BACKUP_DIR
        value: server/backups
      - key: CLIENT_URL
        value: https://ridemate-w9wj.onrender.com
      - key: CORS_ORIGINS
        value: https://ridemate-w9wj.onrender.com
      - key: GEOCODER
        value: nominatim
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: MAPMYINDIA_API_KEY
        sync: false

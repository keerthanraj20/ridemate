services:
  - type: web
    name: ridemate
    runtime: node
    buildCommand: npm run setup && npm run build
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://ridemate-w9wj.onrender.com
      - key: CORS_ORIGINS
        value: https://ridemate-w9wj.onrender.com

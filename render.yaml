services:
  - type: web
    name: ridemate
    runtime: node
    plan: free
    buildCommand: npm run setup && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: RM_TRUST_PROXY
        value: "1"
      - key: RM_BACKUP_DIR
        value: server/backups
      - key: CLIENT_URL
        value: https://ridemate-w9wj.onrender.com
      - key: CORS_ORIGINS
        value: https://ridemate-w9wj.onrender.com
      - key: GEOCODER
        value: nominatim
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: MAPMYINDIA_API_KEY
        sync: false
      # SMS/OTP — set SMS_PROVIDER to textlocal or twilio, then fill the keys below.
      # Leave SMS_PROVIDER as console and OTPs print to the server logs instead.
      - key: SMS_PROVIDER
        value: console
      - key: SMS_TEXTLOCAL_API_KEY
        sync: false
      - key: SMS_TEXTLOCAL_SENDER
        sync: false
      - key: SMS_TWILIO_ACCOUNT_SID
        sync: false
      - key: SMS_TWILIO_AUTH_TOKEN
        sync: false
      - key: SMS_TWILIO_FROM
        sync: false
      # Email — fill MAIL_HOST/USER/PASS to enable real send (Gmail app password works).
      # Leave empty and all emails print to the server logs instead.
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Set to your email to auto-promote that account to admin on boot.
      - key: RM_ADMIN_EMAIL
        sync: false

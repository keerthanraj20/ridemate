services:
  - type: web
    name: ridemate
    runtime: node
    buildCommand: npm run setup && npm run build
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        value: rm-prod-2026-krs-9f3a7b2c1d4e5f6a8b0c
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://ridemate.onrender.com
      - key: CORS_ORIGINS
        value: https://ridemate.onrender.com
    disk:
      mountPath: /data
      sizeGB: 1
